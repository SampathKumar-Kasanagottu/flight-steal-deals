name: flight-deal-scan

on:
  schedule:
    # two chances per hour — GitHub silently skips cron ticks under load;
    # the scanner itself dedupes heartbeats to one per hour
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # scan (~5 min) + the re-arm step's wait to the next hour boundary
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan fares
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scanner.py

      - name: Commit price history
        run: |
          git config user.name "flight-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price_history.json
          git diff --cached --quiet || git commit -m "chore: price history [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true

      # GitHub's schedule: cron is unreliable on low-activity personal repos
      # (it skipped every tick here). Each run waits for the next hour
      # boundary and dispatches its successor, so the chain is self-sustaining
      # entirely within GitHub Actions. Skipped when GH_PAT isn't set.
      - name: Re-arm next hourly run
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        timeout-minutes: 70
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT not set — skipping re-arm (relying on cron)"
            exit 0
          fi
          python rearm.py
