name: flight-deal-scan

on:
  schedule:
    - cron: "7 * * * *"   # hourly, offset from :00 to dodge GitHub cron congestion
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan fares
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scanner.py

      - name: Commit price history
        run: |
          git config user.name "flight-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price_history.json
          git diff --cached --quiet || git commit -m "chore: price history [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true
